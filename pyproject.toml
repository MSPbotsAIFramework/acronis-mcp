[project]
name = "acronis-mcp"
version = "0.1.0"
description = "MCP server for Acronis Cyber Protect Cloud (Alert Manager, Task Manager, Agent Manager, Resource & Policy Management, Account Management APIs)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
acronis-mcp = "acronis_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acronis_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
